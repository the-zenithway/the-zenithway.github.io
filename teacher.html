<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ nav: "teacher", active: "dashboard", actions: ["requests", "logout"] });</script>

<main class="parent-wrap">
  <div class="parent-col">
    <p class="parent-greeting" id="teacher-greeting"></p>
    <p class="parent-subtitle">Grading can be marked complete below; feedback, cheat sheets, and unlocks are still done by hand in the data.</p>

    <div class="teacher-filter-row">
      <label for="teacher-course-filter" class="teacher-filter-label">Subject</label>
      <select id="teacher-course-filter" class="teacher-filter-select"></select>
    </div>

    <h2 class="teacher-section-title">Needs grading <span class="teacher-section-count" id="teacher-queue-count"></span></h2>
    <div id="teacher-queue-list" class="teacher-queue"></div>

    <h2 class="teacher-section-title">Students</h2>
    <div id="teacher-roster"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireTeacherLogin();
  var teacher = getCurrentTeacher();
  renderTeacherDashboard(teacher);

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
