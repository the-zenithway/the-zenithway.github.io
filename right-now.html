<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/platform.css">
<link rel="stylesheet" href="css/mentor.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ active: "now", actions: ["logout"] });</script>

<main class="zp-page" id="zp-main" hidden></main>

<main class="rightnow-wrap" id="legacy-now" hidden>
  <div class="rightnow-col">
    <p class="rightnow-greeting" id="rightnow-greeting"></p>
    <div class="rightnow-card" id="rightnow-card">
      <p class="rightnow-tag" id="rightnow-tag"></p>
      <h1 class="rightnow-title" id="rightnow-title"></h1>
      <p class="rightnow-instruction" id="rightnow-instruction"></p>
      <div class="rightnow-footer">
        <span class="rightnow-due" id="rightnow-due" hidden></span>
        <div class="rightnow-cta-wrap" id="rightnow-cta-wrap" hidden>
          <button type="button" class="btn-primary" id="rightnow-cta">Message us when done →</button>
          <div class="rightnow-contact-menu" id="rightnow-contact-menu" hidden></div>
        </div>
      </div>
      <button type="button" class="rightnow-reveal-btn" id="rightnow-reveal-btn" hidden>Already done with this? See what's next →</button>
    </div>

    <div class="rightnow-card rightnow-buffer" id="rightnow-buffer-card" hidden>
      <div class="rightnow-buffer-head">
        <p class="rightnow-buffer-label">Up next — a head start, not yet confirmed by your mentor</p>
        <button type="button" class="rightnow-fold-btn" id="rightnow-fold-btn">Hide ▲</button>
      </div>
      <h2 class="rightnow-title" id="rightnow-buffer-title"></h2>
      <p class="rightnow-instruction" id="rightnow-buffer-instruction"></p>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/social-links.js"></script>
<script src="js/app.js"></script>
<script src="js/practice-core.js"></script>
<script src="js/zp-config.js"></script>
<script src="js/zp-store.js"></script>
<script src="js/zp-banks.js"></script>
<script src="js/zp-ui.js"></script>
<script src="js/zp-tex.js"></script>
<script src="js/zp-plan.js"></script>
<script src="js/zp-mentor.js"></script>
<script src="js/zp-now.js"></script>
<script>
  requireLogin();
  var student = getCurrentStudent();
  var course = requireSelectedCourse(student);
  document.getElementById('logout-btn').addEventListener('click', logout);
  if (course) {
    if (ZP_CONFIG.COURSES[course.id]) {
      // Courses on the platform: tasks, reviews, calendar and the chapter flow, ranked (js/zp-now.js).
      var main = document.getElementById('zp-main'); main.hidden = false; ZPUI.guard(main);
      ZPNow.mount(main, { student: student, course: course });
    } else {
      // Courses that are not on the platform are just their roadmap: there is no Right Now for them.
      location.replace('roadmap.html?course=' + encodeURIComponent(course.id));
    }
  }
</script>
</body>
</html>
