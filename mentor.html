<script>
  requireLogin();
  (function () {
    var ctx = ZPUI.resolveContext(), main = document.getElementById('zp-main');
    ZPUI.guard(main);
    var lo = document.getElementById('logout-btn'); if (lo) lo.addEventListener('click', logout);
    if (!ctx) return;
    if (!ctx.course) { main.innerHTML = ZPUI.emptyState('Mentor is for courses on the platform', 'Available for AP Calculus BC and AP Chemistry.', '<a class="zp-btn primary" href="portal.html">Back to courses</a>'); return; }
    ZPMentor.mount(main, ctx);
  })();
</script>
