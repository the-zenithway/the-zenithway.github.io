<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ active: "submit", actions: ["open", "logout"] });</script>

<main class="submit-wrap">
  <div class="submit-col">
    <p class="submit-greeting" id="submit-greeting"></p>

    <div class="submit-cta-card">
      <h2 class="submit-cta-title">Submit your work</h2>
      <p class="submit-cta-text">Finished a chapter or unit? Open the form to submit it — you'll pick your class, chapter, and unit there, and can attach a photo of your work.</p>
      <a id="submit-cta-link" class="btn-primary" href="#" target="_blank" rel="noopener">Open the submission form ↗</a>
    </div>

    <div>
      <h2 class="submit-log-heading">Your submissions</h2>
      <div class="submit-log-list" id="submit-log-list"></div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  var student = getCurrentStudent();
  var course = requireSelectedCourse(student);
  if (course) {
    var formUrl = course.submissionFormUrl || SUBMISSION_FORM_URL;
    document.getElementById('submit-greeting').textContent = "Hey " + student.name.split(" ")[0] + ",";
    document.getElementById('submit-cta-link').href = formUrl;
    document.getElementById('open-direct-link').href = formUrl;
    renderSubmissionLog(student, course);
  }

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
