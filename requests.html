<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>
  // No requireAnyLogin() redirect on this page — a "Resource Request"
  // can be submitted without an account (see the guest-mode branch
  // below), so anyone reaching this page stays here. Logged-in users
  // still get the full portal-style bar with a logout button; a
  // logged-out visitor gets the same bar minus that button (localStorage
  // is checked directly here, before js/app.js's getCurrentPerson()
  // is even available, since that needs js/data.js which loads later).
  var isLoggedIn = !!localStorage.getItem('loggedInRole');
  renderPortalHeader({ nav: "label", label: "Requests", actions: isLoggedIn ? ["logout"] : [] });
</script>

<main class="requests-wrap">
  <div class="requests-col">
    <p class="requests-greeting" id="requests-greeting"></p>

    <div class="requests-form-card">
      <h2 class="requests-form-title">Submit a request</h2>
      <p class="requests-form-text" id="requests-form-text">Missing a resource, found a bug, or just have a concern? Tell us here — teachers and admins see every request that comes in.</p>

      <div id="requests-guest-fields" hidden>
        <label class="requests-field-label" for="requests-guest-name">Name</label>
        <input id="requests-guest-name" class="requests-input" type="text" maxlength="80" placeholder="Your name">

        <label class="requests-field-label" for="requests-guest-email">Email</label>
        <input id="requests-guest-email" class="requests-input" type="email" maxlength="120" placeholder="you@example.com — so we can confirm we got it">
      </div>

      <label class="requests-field-label" for="requests-category">Category</label>
      <select id="requests-category" class="requests-select">
        <option value="Feature Request">Feature Request</option>
        <option value="Resource Request">Resource Request</option>
        <option value="Bug Report">Bug Report</option>
        <option value="Ask My Teacher">Ask My Teacher</option>
        <option value="Concern / Other">Concern / Other</option>
      </select>
      <p class="requests-field-note" id="requests-guest-note" hidden>Feature requests and bug reports need an account, so we know who to follow up with — <a href="login.html?redirect=requests.html">log in</a> to submit one of those instead.</p>

      <div id="requests-course-field" hidden>
        <label class="requests-field-label" for="requests-course">Which course is this about?</label>
        <select id="requests-course" class="requests-select"></select>
      </div>

      <label class="requests-field-label" for="requests-title">Title</label>
      <input id="requests-title" class="requests-input" type="text" maxlength="120" placeholder="Short summary">

      <label class="requests-field-label" for="requests-details">Details</label>
      <textarea id="requests-details" class="requests-textarea" rows="5" placeholder="As much detail as helps"></textarea>

      <button type="button" class="btn-primary requests-submit-btn" id="requests-submit-btn">Submit request</button>
    </div>

    <div id="requests-history-section">
      <h2 class="requests-log-heading">Your requests</h2>
      <div class="requests-log-list" id="requests-log-list"></div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  var person = getCurrentPerson(); // null, not a redirect — this page allows anonymous Resource Requests
  var categorySelect = document.getElementById('requests-category');
  var courseField = document.getElementById('requests-course-field');
  var courseSelect = document.getElementById('requests-course');

  // "Ask My Teacher" only makes sense for a logged-in student — it
  // routes to whichever teacher CLASSES assigns to the course picked
  // below. Anonymous mode already replaces the whole dropdown with
  // just "Resource Request" further down, so this only needs handling
  // for logged-in non-student roles (teacher/parent/admin).
  function toggleCourseField_() {
    var isAskTeacher = categorySelect.value === 'Ask My Teacher';
    courseField.hidden = !isAskTeacher;
  }

  if (person) {
    document.getElementById('requests-greeting').textContent = "Hey " + person.name.split(" ")[0] + ",";
    renderRequestsLog(person);

    if (person.role === 'student') {
      var student = getCurrentStudent();
      courseSelect.innerHTML = (student.courses || []).map(function (c) {
        return '<option value="' + c.id + '">' + escapeHtml_(c.name) + '</option>';
      }).join('');
    } else {
      Array.prototype.slice.call(categorySelect.options).forEach(function (opt) {
        if (opt.value === 'Ask My Teacher') categorySelect.removeChild(opt);
      });
    }
    categorySelect.addEventListener('change', toggleCourseField_);

    // Lets a link like resources.html's "Request a resource" banner
    // land here with the right category already picked, instead of
    // making the visitor re-select what they just clicked for.
    var requestedCategory = new URLSearchParams(window.location.search).get('category');
    if (requestedCategory && REQUEST_CATEGORIES.indexOf(requestedCategory) !== -1) {
      categorySelect.value = requestedCategory;
      toggleCourseField_();
    }
  } else {
    document.getElementById('requests-greeting').textContent = "Request a resource";
    document.getElementById('requests-form-text').textContent = "Don't see a resource you need? Tell us here — no account needed.";
    document.getElementById('requests-guest-fields').hidden = false;
    document.getElementById('requests-guest-note').hidden = false;
    document.getElementById('requests-history-section').hidden = true;
    // Anonymous submissions are Resource-Request-only — enforced again
    // server-side in zenith-data-writer.gs, this is just the UI lock.
    categorySelect.innerHTML = '<option value="Resource Request">Resource Request</option>';
    categorySelect.disabled = true;
  }

  document.getElementById('requests-submit-btn').addEventListener('click', function () {
    submitRequestForm_(person, this);
  });

  var logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) logoutBtn.addEventListener('click', logout);
</script>
</body>
</html>
