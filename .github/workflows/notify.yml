name: Zenith notifications

on:
  push:
    branches: [main]
    paths: ["js/data.js", "js/blog-data.js", "resources.html", "philosophy.html"]
  # No `schedule:` trigger yet — there are no IRL sessions running yet, so
  # the weekly reminder has nothing real to remind anyone of. The job below
  # is left in place (still runnable manually via workflow_dispatch) so it's
  # ready to switch on: once sessions start, add back a `schedule:` block
  # here with the real cron time, and fix SESSION_DAY/SESSION_TIME below to
  # match it.
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        type: choice
        options: [notify-on-push, notify-content-updates, weekly-session-reminder]
        default: notify-on-push

jobs:
  notify-on-push:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'notify-on-push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: automation/notifications

      - name: Extract old data.js (previous commit)
        run: git show HEAD^:js/data.js > /tmp/old-data.js || echo "const STUDENTS = [];" > /tmp/old-data.js

      - name: Send notifications
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node notify-on-push.js /tmp/old-data.js ../../js/data.js
        working-directory: automation/notifications

  notify-content-updates:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'notify-content-updates')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: automation/notifications

      - name: Extract previous versions of blog-data.js / resources.html / philosophy.html
        run: |
          git show HEAD^:js/blog-data.js > /tmp/old-blog-data.js || echo "const BLOG_POSTS = [];" > /tmp/old-blog-data.js
          git show HEAD^:resources.html > /tmp/old-resources.html || echo "" > /tmp/old-resources.html
          git show HEAD^:philosophy.html > /tmp/old-philosophy.html || echo "" > /tmp/old-philosophy.html

      - name: Send content update notifications
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: >
          node notify-content-updates.js ../../js/data.js
          /tmp/old-blog-data.js ../../js/blog-data.js
          /tmp/old-resources.html ../../resources.html
          /tmp/old-philosophy.html ../../philosophy.html
        working-directory: automation/notifications

  weekly-session-reminder:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-session-reminder')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: automation/notifications

      - name: Send session reminder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SESSION_DAY: "Saturday"
          SESSION_TIME: "under 90 minutes"
        run: node notify-session-reminder.js ../../js/data.js
        working-directory: automation/notifications
