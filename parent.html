<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Dashboard — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
<script src="js/i18n.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ nav: "label", label: "Parent Dashboard", actions: ["calendar", "lang", "logout"] });</script>

<main class="parent-wrap">
  <div class="parent-col">
    <p class="parent-greeting" id="parent-greeting"></p>
    <p class="parent-subtitle">A read-only summary — nothing here can be edited or submitted from this account.</p>
    <div id="parent-summary"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireParentLogin();
  var parent = getCurrentParent();

  renderLangToggle('lang-toggle-mount', function (lang) {
    renderParentDashboard(parent, lang);
  });

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
