<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body>

<div id="header-mount"></div>
<script>renderSiteHeader({ showAuth: false });</script>

<main>
  <section class="login-section container">
    <div class="login-card">
      <h1>Student Log In</h1>
      <p class="muted">Enter your username and password to access your portal.</p>

      <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <p id="login-error" class="error-message" hidden>Incorrect username or password. Try again.</p>

        <button type="submit" class="btn-primary btn-full">Log In</button>
      </form>
    </div>
  </section>
</main>

<div id="footer-mount"></div>
<script>renderFooter();</script>

<script src="js/data.js"></script>
<script src="js/social-links.js"></script>
<script src="js/app.js"></script>
<script>
  renderSocialLinks();

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (login(username, password)) {
      window.location.href = getLoginRedirect();
    } else {
      document.getElementById('login-error').hidden = false;
    }
  });
</script>
</body>
</html>
