<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Catalog — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ active: "catalog", actions: ["logout"] });</script>

<main class="catalog-wrap">
  <section class="catalog-panel" aria-labelledby="catalog-title">
    <div class="catalog-heading">
      <p class="catalog-eyebrow">Course catalog</p>
      <h1 id="catalog-title">Every class we offer</h1>
      <p class="catalog-subtitle">Every class and subject at Zenith, in one place. An admin picks each class's roster — there's no self-serve "Register" button here yet.</p>
    </div>
    <div id="catalog-grid" class="catalog-grid"></div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  renderCatalog(getCurrentStudent());

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
