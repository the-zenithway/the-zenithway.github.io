<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ active: "courses", actions: ["logout"] });</script>

<main class="course-portal-wrap">
  <section class="course-folder" aria-labelledby="course-folder-title">
    <div class="course-folder-heading">
      <p class="course-folder-eyebrow">My courses</p>
      <h1 id="course-folder-title">Choose a roadmap</h1>
      <p id="course-folder-greeting" class="course-folder-greeting"></p>
    </div>
    <div id="course-app-grid" class="course-app-grid"></div>
    <p id="course-folder-empty" class="course-folder-empty" hidden>You are not enrolled in a course yet.</p>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  var student = getCurrentStudent();
  renderCoursePortal(student);

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
