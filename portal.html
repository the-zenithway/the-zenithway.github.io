<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="portal-body">

<header class="portal-bar">
  <div class="portal-bar-left">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 100 70" aria-hidden="true" focusable="false">
        <path d="M50,2 L61,22 L50,17 L39,22 Z" fill="currentColor"/>
        <rect x="47.6" y="19" width="2" height="36" fill="currentColor"/>
        <rect x="52.4" y="19" width="1.6" height="36" fill="currentColor"/>
        <path d="M7,58 C24,58 33,58 34,56 C42,42 45,23 49,23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M93,58 C76,58 67,58 66,56 C58,42 55,23 51,23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-wordmark" aria-hidden="true">Z<span class="logo-e"><span></span><span></span><span></span></span>NITH</span>
      <span class="sr-only">Zenith</span>
    </a>
    <nav class="portal-nav">
      <a href="portal.html" class="portal-nav-link active">Courses</a>
      <a href="right-now.html" class="portal-nav-link">Now</a>
      <a href="feedback.html" class="portal-nav-link">Feedback</a>
      <a href="calendar.html" class="portal-nav-link">Calendar</a>
      <a href="submit.html" class="portal-nav-link">Submit</a>
    </nav>
  </div>
  <div class="portal-actions">
    <button id="logout-btn" class="portal-logout">Log out</button>
  </div>
</header>

<main class="course-portal-wrap">
  <section class="course-folder" aria-labelledby="course-folder-title">
    <div class="course-folder-heading">
      <p class="course-folder-eyebrow">My courses</p>
      <h1 id="course-folder-title">Choose a roadmap</h1>
      <p id="course-folder-greeting" class="course-folder-greeting"></p>
    </div>
    <div id="course-app-grid" class="course-app-grid"></div>
    <p id="course-folder-empty" class="course-folder-empty" hidden>You are not enrolled in a course yet.</p>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  var student = getCurrentStudent();
  renderCoursePortal(student);

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
