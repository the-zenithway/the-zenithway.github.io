<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheat Sheet — Zenith</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="js/layout.js"></script>
</head>
<body class="portal-body">

<div id="header-mount"></div>
<script>renderPortalHeader({ actions: ["logout"] });</script>

<main class="feedback-wrap">
  <div class="feedback-col">
    <p class="feedback-greeting" id="cheatsheet-greeting"></p>
    <div class="feedback-list" id="cheatsheet-list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  var student = getCurrentStudent();
  var course = requireSelectedCourse(student);
  if (course) {
    renderCheatSheetPage(student);
    renderMath(document.querySelector('.feedback-col'));
  }

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
